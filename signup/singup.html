<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>CompostCare</title>

   
    <!-- CSS -->
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/navbar.css" />
    <link rel="stylesheet" href="../css/footer.css" />
    <link rel="stylesheet" href="signup.css" />

    <!-- Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <script src="https://unpkg.com/lucide@latest" defer></script>
    <script src="../components/component.js" defer></script>
    <script src="../global/global.js" defer></script>
    <script src="signup.js" defer></script>
  </head>
  <body>
    <!-- =========================================================
         SIGN UP PAGE
    ========================================================= -->

    <main class="signup-page">
      <!-- =========================================================
     SIGN UP BACKGROUND ANIMATION
========================================================= -->

      <div class="login-bg-animation" aria-hidden="true">
        <span class="login-bg-orb login-bg-orb-one"></span>
        <span class="login-bg-orb login-bg-orb-two"></span>

        <span class="login-bg-particle particle-one"></span>
        <span class="login-bg-particle particle-two"></span>
        <span class="login-bg-particle particle-three"></span>
        <span class="login-bg-particle particle-four"></span>
        <span class="login-bg-particle particle-five"></span>
        <span class="login-bg-particle particle-six"></span>

        <span class="login-bg-ring ring-one"></span>
        <span class="login-bg-ring ring-two"></span>

        <span class="login-bg-line line-one"></span>
        <span class="login-bg-line line-two"></span>
      </div>
      <!-- =====================================================
             PAGE CONTROLS
        ===================================================== -->

      <div class="signup-page-controls">
        <button
          type="button"
          class="signup-control-btn"
          id="rtlToggle"
          aria-label="Toggle RTL"
        >
          <i data-lucide="languages"></i>
        </button>

        <button
          type="button"
          class="signup-control-btn"
          id="themeToggle"
          aria-label="Toggle dark mode"
        >
          <i data-lucide="sun"></i>
        </button>
      </div>

      <!-- =====================================================
             SIGN UP CARD
        ===================================================== -->

      <section class="signup-container">
        <!-- =================================================
                 LOGO + BRAND
            ================================================= -->

        <a
          href="../Home1/home1.html"
          class="signup-brand"
          aria-label="CompostCare Home"
        >
          <img src="../images/logo.png" alt="CompostCare Logo" />

          <span class="signup-brand-text">
            <span class="signup-brand-primary">Compost</span
            ><span class="signup-brand-secondary">Care</span>
          </span>
        </a>

        <!-- =================================================
                 SIGN UP INTRO
            ================================================= -->

        <div class="signup-intro">
          <h1>Create Your Account</h1>

          <p>Join CompostCare and start making a difference.</p>
        </div>

        <!-- =================================================
                 SIGN UP FORM
            ================================================= -->

        <form class="signup-form" id="signupForm">
          <!-- =================================================
                     FIRST NAME + LAST NAME
                ================================================= -->

          <div class="signup-name-row">
            <!-- FIRST NAME -->

            <div class="signup-field">
              <label for="signupFirstName"> First Name </label>

              <div class="signup-input-wrapper">
                <i data-lucide="user"></i>

                <input
                  type="text"
                  id="signupFirstName"
                  name="firstName"
                  placeholder="First name"
                  autocomplete="given-name"
                  required
                />
              </div>
            </div>

            <!-- LAST NAME -->

            <div class="signup-field">
              <label for="signupLastName"> Last Name </label>

              <div class="signup-input-wrapper">
                <i data-lucide="user"></i>

                <input
                  type="text"
                  id="signupLastName"
                  name="lastName"
                  placeholder="Last name"
                  autocomplete="family-name"
                  required
                />
              </div>
            </div>
          </div>

          <!-- =================================================
                     EMAIL
                ================================================== -->

          <div class="signup-field">
            <label for="signupEmail"> Email Address </label>

            <div class="signup-input-wrapper">
              <i data-lucide="mail"></i>

              <input
                type="email"
                id="signupEmail"
                name="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
              />
            </div>
          </div>

          <!-- =================================================
                     PHONE NUMBER
                ================================================== -->

          <div class="signup-field">
            <label for="signupPhone"> Phone Number </label>

            <div class="signup-input-wrapper">
              <i data-lucide="phone"></i>

              <input
                type="tel"
                id="signupPhone"
                name="phone"
                placeholder="Enter your phone number"
                autocomplete="tel"
                required
              />
            </div>
          </div>

          <!-- =================================================
                     PASSWORD
                ================================================== -->

          <div class="signup-field">
            <label for="signupPassword"> Password </label>

            <div class="signup-input-wrapper">
              <i data-lucide="lock"></i>

              <input
                type="password"
                id="signupPassword"
                name="password"
                placeholder="Create a password"
                autocomplete="new-password"
                required
              />

              <button
                type="button"
                class="signup-password-toggle"
                id="signupPasswordToggle"
                aria-label="Show password"
              >
                <i data-lucide="eye"></i>
              </button>
            </div>
          </div>

          <!-- =================================================
                     CONFIRM PASSWORD
                ================================================== -->

          <div class="signup-field">
            <label for="signupConfirmPassword"> Confirm Password </label>

            <div class="signup-input-wrapper">
              <i data-lucide="lock-keyhole"></i>

              <input
                type="password"
                id="signupConfirmPassword"
                name="confirmPassword"
                placeholder="Confirm your password"
                autocomplete="new-password"
                required
              />

              <button
                type="button"
                class="signup-password-toggle"
                id="signupConfirmPasswordToggle"
                aria-label="Show password"
              >
                <i data-lucide="eye"></i>
              </button>
            </div>
          </div>

          <div class="signup-terms">
            <label class="signup-terms-label">
              <input type="checkbox" id="signupTerms" name="terms" required />

              <span>
                I agree to the
                <a href="#" class="signup-terms-link">Terms &amp; Conditions</a>
                and
                <a href="#" class="signup-terms-link">Privacy Policy</a>
              </span>
            </label>
          </div>

          <!-- =================================================
                     SIGN UP BUTTON
                ================================================== -->

          <button type="submit" class="signup-submit">Create Account</button>

          <!-- =================================================
                     SOCIAL SIGN UP DIVIDER
                ================================================== -->

          <div class="signup-divider">
            <span></span>

            <p>Or continue with</p>

            <span></span>
          </div>

          <!-- =================================================
                     SOCIAL SIGN UP OPTIONS
                ================================================== -->

          <div class="signup-social-options">
            <!-- GOOGLE -->

            <button type="button" class="signup-social-btn signup-google">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  fill="#4285F4"
                  d="M21.35 12.27c0-.79-.07-1.55-.22-2.27H12v4.3h5.22a4.46 4.46 0 0 1-1.94 2.93v2.43h3.14c1.84-1.69 2.93-4.18 2.93-7.39z"
                />

                <path
                  fill="#34A853"
                  d="M12 21.75c2.63 0 4.84-.87 6.45-2.36l-3.14-2.43c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.3v2.5A9.74 9.74 0 0 0 12 21.75z"
                />

                <path
                  fill="#FBBC05"
                  d="M6.54 13.85A5.85 5.85 0 0 1 6.23 12c0-.64.11-1.27.31-1.85v-2.5H3.3A9.75 9.75 0 0 0 2.25 12c0 1.57.38 3.06 1.05 4.35l3.24-2.5z"
                />

                <path
                  fill="#EA4335"
                  d="M12 6.12c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.84 3.2 14.63 2.25 12 2.25a9.74 9.74 0 0 0-8.7 5.4l3.24 2.5C6.31 7.84 8.46 6.12 12 6.12z"
                />
              </svg>

              <span> Google </span>
            </button>

            <!-- APPLE -->

            <button type="button" class="signup-social-btn signup-apple">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  fill="currentColor"
                  d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.09.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.97.48 7.12-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25C11.88 5.02 13.69 3.18 15.77 3c.29 2.58-2.34 4.5-3.74 4.25z"
                />
              </svg>

              <span> Apple </span>
            </button>
          </div>

          <!-- =================================================
                     LOGIN LINK
                ================================================== -->

          <p class="signup-login-link">
            Already have an account?

            <a href="../Login/login.html"> Login </a>
          </p>
        </form>
      </section>
    </main>
  </body>
</html>
